services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: firsttry
      POSTGRES_PASSWORD: local-firsttry
      POSTGRES_DB: firsttry
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firsttry"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: firsttry-local
      MINIO_ROOT_PASSWORD: local-firsttry-storage
    ports: ["9000:9000", "9001:9001"]
    volumes: ["objects:/data"]
volumes:
  postgres:
  objects:
